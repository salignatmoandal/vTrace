# vTrace — Python package (adapters, CLI, validator, native bindings).
#
# The native extension (_vtrace) is built by maturin from the Rust
# crate at crates/vtrace-python. The Python source lives in src/vtrace/.

[project]
name = "vtrace"
version = "0.0.0"
description = "Performance profiling for real-time Voice AI."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4",
]

[project.scripts]
vtrace = "vtrace.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8",
    "maturin>=1.5,<2.0",
]

[tool.maturin]
manifest-path = "../crates/vtrace-python/Cargo.toml"
python-source = "src"
module-name = "vtrace._vtrace"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.pyright]
include = ["src/vtrace", "tests"]
strict = []

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"
