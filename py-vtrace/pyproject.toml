# vTrace — Python package (adapters, CLI, validator).
#
# SCAFFOLD ONLY. The validator is real so `just validate` works against
# the schema from P0; the rest (adapters, CLI) is filled in at P1.

[project]
name = "vtrace"
version = "0.0.0"
description = "Performance profiling for real-time Voice AI."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4",
]

[project.scripts]
vtrace = "vtrace.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vtrace"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.pyright]
include = ["src/vtrace", "tests"]
# Basic mode for the P0 harness. Strict mode returns when the typed
# collector (P1) lands; it is too noisy for dynamic JSON validation code.
strict = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
